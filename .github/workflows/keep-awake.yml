# Pings the Streamlit app every 2 hours so Community Cloud never puts it to
# sleep (apps sleep after ~12h without traffic, and waking takes 1-2 minutes).
#
# Note: GitHub disables scheduled workflows after 60 days of no repo activity.
# This app commits to the repo on every save, so the schedule stays alive
# naturally. If the app ever goes quiet for two months, re-enable it from the
# Actions tab.
name: Keep app awake

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (offset from :00 to dodge cron rush)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          curl --silent --show-error --fail --location \
               --max-time 120 --retry 3 --retry-delay 10 \
               --output /dev/null \
               https://metal-earth-tracker.streamlit.app/
          echo "App responded — still awake."
